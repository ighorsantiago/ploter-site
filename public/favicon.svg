<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Fundo escuro com bordas arredondadas (cor primária Ploter) -->
  <rect width="32" height="32" rx="6" fill="#111827"/>
  <!-- Moldura da foto (borda laranja) -->
  <rect x="4" y="5" width="24" height="20" rx="2" fill="none" stroke="#F97316" stroke-width="2"/>
  <!-- Área interna da imagem -->
  <rect x="6" y="7" width="20" height="16" rx="1" fill="#1f2937"/>
  <!-- Sol (representando impressão/visual) -->
  <circle cx="11" cy="13" r="3" fill="#F97316"/>
  <!-- Montanhas / paisagem -->
  <polygon points="6,23 12,14 18,21 22,16 26,23" fill="#F97316" opacity="0.85"/>
</svg>
